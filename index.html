<!DOCTYPE html>
<html lang="zh-Hant">
<head>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#f4f7fa;--fg:#1b2733;--panel:#fff;--line:#c9d6e2;--water:#dcebf7;--ship:#6b7f93;--hit:#e5484d;--miss:#8aa4bd;--sunk:#7a1f23;--accent:#1f6feb;--t0:#8b5cf6;--t1:#f97316;--t2:#eab308;--t3:#ec4899;--ok:#2da44e;--bad:#e5484d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151c;--fg:#e3ecf4;--panel:#16212b;--line:#2b3b4a;--water:#1b3347;--ship:#8fa3b8;--miss:#58738d;--sunk:#a32a30}}
:root[data-theme="dark"]{--bg:#0e151c;--fg:#e3ecf4;--panel:#16212b;--line:#2b3b4a;--water:#1b3347;--ship:#8fa3b8;--miss:#58738d;--sunk:#a32a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.5}
main{max-width:1100px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
h1{font-size:22px;margin:0 0 4px}
#status{font-size:16px;font-weight:600;min-height:26px;margin:6px 0 12px}
.boards{display:flex;flex-wrap:nowrap;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;flex:1 1 0;min-width:0}
.card h2{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(calc(var(--n,10) + 1),1fr);gap:2px;user-select:none;touch-action:manipulation}
.grid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:3px}
.lab{color:var(--miss)}
.c{background:var(--water)}
.c.ship{background:var(--tc,var(--ship))}
.c.t0{--tc:var(--t0)}.c.t1{--tc:var(--t1)}.c.t2{--tc:var(--t2)}.c.t3{--tc:var(--t3)}
.c.hit,.c.sunk{box-shadow:inset 0 0 0 2px var(--tc,transparent)}
.c.pv-ok{background:var(--ok);opacity:.7}
.c.pv-bad{background:var(--bad);opacity:.55}
.c.miss::after{content:"";width:28%;height:28%;border-radius:50%;background:var(--miss)}
.c.hit{background:var(--hit)}
.c.hit::after{content:"✕";color:#fff;font-weight:700}
.c.sunk{background:var(--sunk)}
.c.sunk::after{content:"✕";color:#fff;font-weight:700}
.enemy .c:not(.hit):not(.miss):not(.sunk):hover{outline:2px solid var(--accent);cursor:crosshair}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.4;cursor:not-allowed}
.fleet{margin-top:10px;font-size:13px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.fleet span.d{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--ship);margin-right:2px}
.fleet .sk{text-decoration:line-through;opacity:.6}
.fleet .sk .d{background:var(--hit)!important}
#log{margin-top:14px;font-size:14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:60px}
#log p{margin:2px 0}#log p:first-child{font-weight:600}
.hide{display:none}
.code{font-size:20px;letter-spacing:3px;font-family:monospace;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 10px}
#lobby{align-items:center}
#lobby input{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);width:130px;text-transform:uppercase}
.note{font-size:13px;opacity:.75}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
@media(max-width:600px){.big .boards{flex-wrap:wrap}.big .card{flex:1 1 100%}}
@media(orientation:landscape) and (max-height:520px){h1{display:none}#status{margin:0 0 6px;font-size:14px}.bar{margin:6px 0}.card{padding:8px}.card h2{margin:0 0 4px;font-size:13px}.grid{width:min(100%,calc(100vh - 110px));margin:0 auto}.big .boards{flex-wrap:nowrap}.big .card{flex:1 1 0}}
@media(max-width:600px){main{padding:8px}.card{padding:6px}.grid{gap:1px}.grid div{font-size:9px}.fleet{grid-template-columns:1fr;font-size:11px}}
</style>
</head>
<body>
<main>
<h1>⚓ 海戰棋</h1>
<div id="status"></div>
<div id="lobby" class="bar"></div>
<div id="setup" class="bar"></div>
<div class="boards">
  <div class="card enemy" id="ecard"><h2>敵方海域（點擊攻擊）</h2><div class="grid" id="eg"></div><div class="fleet" id="ef"></div></div>
  <div class="card" id="pcard"><h2>我方海域</h2><div class="grid" id="pg"></div><div class="fleet" id="pf"></div></div>
</div>
<div id="log"></div>
</main>
<script>
const NAMES=[['航空母艦',5],['戰艦',4],['驅逐艦',3],['潛水艇',2]];
const PRESETS={6:[0,1,1,2],8:[1,1,2,2],10:[1,2,3,4],12:[2,3,4,4],15:[3,4,5,6]};
const buildFleet=n=>NAMES.flatMap(([nm,l],k)=>Array.from({length:PRESETS[n][k]},()=>[nm,l]));
let N=10,FLEET=buildFleet(10);
const LET='ABCDEFGHIJKLMNO';
const nb=()=>({g:Array(N*N).fill(-1),s:Array(N*N).fill(0),ships:[]});
const name=i=>LET[i%N]+((i/N|0)+1);
function cellsFor(i,len,v){const r=i/N|0,c=i%N;if(v?r+len>N:c+len>N)return null;return Array.from({length:len},(_,k)=>v?i+k*N:i+k)}
function can(b,i,len,v){const cs=cellsFor(i,len,v);return cs&&cs.every(x=>b.g[x]<0)?cs:null}
function put(b,cs,n){const id=b.ships.length;cs.forEach(x=>b.g[x]=id);b.ships.push({name:n,len:cs.length,cells:cs,hits:0})}
function randomFill(){for(;;){const b=nb();let ok=true;for(const [n,l] of FLEET){let cs=null;for(let t=0;t<400&&!cs;t++)cs=can(b,Math.random()*N*N|0,l,Math.random()<.5);if(!cs){ok=false;break}put(b,cs,n)}if(ok)return b}}
const sunk=s=>s.hits===s.len;
const allSunk=b=>b.ships.length===FLEET.length&&b.ships.every(sunk);
function shoot(b,i){b.s[i]=1;const id=b.g[i];if(id<0)return{hit:false};b.s[i]=2;const sh=b.ships[id];sh.hits++;return{hit:true,sh,sunk:sunk(sh)}}

let revealed=false,oppRev=null;
let P=nb(),E=null,phase='place',vert=false,hover=-1,turn='p',busy=false,logs=[];
const $=id=>document.getElementById(id);

function aiPick(){
  const un=P.ships.filter(s=>!sunk(s));
  const sc=Array(N*N).fill(0);
  const resolved=i=>P.s[i]===2&&sunk(P.ships[P.g[i]]);
  for(const s of un)for(const v of [false,true])for(let i=0;i<N*N;i++){
    const cs=cellsFor(i,s.len,v);if(!cs)continue;
    if(cs.some(x=>P.s[x]===1||resolved(x)))continue;
    const k=cs.filter(x=>P.s[x]===2).length;
    const w=k?1+60*k*k:1;
    cs.forEach(x=>{if(P.s[x]===0)sc[x]+=w});
  }
  let best=-1,c=[];
  for(let i=0;i<N*N;i++){if(P.s[i])continue;if(sc[i]>best){best=sc[i];c=[i]}else if(sc[i]===best)c.push(i)}
  return c[Math.random()*c.length|0];
}

function log(t){logs.unshift(t);logs=logs.slice(0,6);$('log').innerHTML=logs.map(x=>`<p>${x}</p>`).join('')}
function describe(who,i,r){
  const a=who==='p'?'你':OPP,t=who==='p'?'敵方':'你的';
  if(!r.hit)return `${a}攻擊 ${name(i)}：未命中。`;
  return r.sunk?`${a}攻擊 ${name(i)}：命中，擊沉${t}${r.sh.name}！💥`:`${a}攻擊 ${name(i)}：命中${t}${r.sh.name}！`;
}

function gridHTML(b,own,pv){
  let h='<div></div>'+[...LET.slice(0,N)].map(l=>`<div class="lab">${l}</div>`).join('');
  for(let i=0;i<N*N;i++){
    if(i%N===0)h+=`<div class="lab">${i/N+1}</div>`;
    let c='c';const id=b.g[i];
    if((own||revealed)&&id>=0)c+=' ship';
    if(id>=0&&(own||revealed||sunk(b.ships[id])))c+=' t'+NAMES.findIndex(n=>n[0]===b.ships[id].name);
    if(b.s[i]===1)c+=' miss';
    if(b.s[i]===2)c+=(id>=0&&sunk(b.ships[id]))?' sunk':' hit';
    if(pv&&pv.cs.includes(i))c+=pv.ok?' pv-ok':' pv-bad';
    h+=`<div class="${c}" data-i="${i}"></div>`;
  }
  return h;
}
function fleetHTML(b){
  if(!b||!b.ships.length)return '';
  return b.ships.map(s=>`<div class="${sunk(s)?'sk':''}"><span>${s.name}</span> ${Array.from({length:s.len},()=>`<span class="d" style="background:var(--t${NAMES.findIndex(n=>n[0]===s.name)})"></span>`).join('')}</div>`).join('');
}

function showPreview(){
  document.querySelectorAll('#pg .pv-ok,#pg .pv-bad').forEach(x=>x.classList.remove('pv-ok','pv-bad'));
  if(phase!=='place'||P.ships.length>=FLEET.length||hover<0)return;
  const len=FLEET[P.ships.length][1],r=hover/N|0,c=hover%N;
  const cs=Array.from({length:len},(_,k)=>vert?(r+k<N?hover+k*N:-1):(c+k<N?hover+k:-1)).filter(x=>x>=0);
  const ok=cs.length===len&&cs.every(x=>P.g[x]<0);
  cs.forEach(x=>{const el=document.querySelector(`#pg [data-i="${x}"]`);if(el)el.classList.add(ok?'pv-ok':'pv-bad')});
}
function render(){
  $('pg').innerHTML=gridHTML(P,true,null);
  $('pf').innerHTML=fleetHTML(P);
  showPreview();
  renderLobby();
  $('ecard').classList.toggle('hide',phase==='place'||phase==='wait');
  $('ecard').querySelector('h2').textContent=revealed?'敵方海域（已公開布置）':'敵方海域（點擊攻擊）';
  $('pcard').querySelector('h2').textContent=revealed?'我方海域（已公開布置）':'我方海域';
  if(E){$('eg').innerHTML=gridHTML(E,false);$('ef').innerHTML=fleetHTML(E)}
  const s=$('setup');
  if(phase==='place'){
    const n=P.ships.length;
    s.innerHTML=`${sizeSel()}<button id="bR" ${n>=FLEET.length?'disabled':''}>旋轉：${vert?'垂直 ↕':'水平 ↔'}</button><button id="bU" ${n?'':'disabled'}>撤銷上一艘</button><button id="bX">隨機布置</button><button id="bC" ${n?'':'disabled'}>清空</button><button id="bS" class="primary" ${n<FLEET.length?'disabled':''}>${mode==='ai'?'開始遊戲':'準備完成'}</button>`;
    $('status').textContent=n<FLEET.length?`請布置：${FLEET[n][0]}（長度 ${FLEET[n][1]}）— 點擊我方海域放置，已放 ${n}/${FLEET.length}`:'艦隊已布置完成，可按「開始遊戲」';
    $('bR').onclick=()=>{vert=!vert;render()};
    $('sz').onchange=e=>setSize(+e.target.value);
    $('bU').onclick=()=>{const sh=P.ships.pop();sh.cells.forEach(x=>P.g[x]=-1);render()};
    $('bX').onclick=()=>{P=randomFill();render()};
    $('bC').onclick=()=>{P=nb();render()};
    $('bS').onclick=mode==='ai'?start:readyOnline;
  }else{
    s.innerHTML=`<button id="bN">重新開始</button>`;
    $('bN').onclick=()=>{leaveRoom();P=nb();E=null;phase='place';logs=[];$('log').innerHTML='';render()};
    if(phase==='play')$('status').textContent=turn==='p'?'輪到你了：點擊敵方海域選擇目標':(mode==='ai'?'電腦思考中…':'等待對手出手…');
    else if(phase==='wait')$('status').textContent=(me==='h'&&!ev['g-join'])?'房間序號 '+code+'：等待對手加入並完成布置…':(ev[(me==='h'?'g':'h')+'-ready']?'雙方就緒，決定先攻中…':'已準備完成，等待對手完成布置…');
  }
}

function start(){
  revealed=false;oppRev=null;E=randomFill();phase='play';logs=[];
  turn=Math.random()<.5?'p':'c';
  log(turn==='p'?'擲硬幣結果：你先攻！':'擲硬幣結果：電腦先攻！');
  render();
  if(turn==='c')setTimeout(aiTurn,900);
}
function end(win){phase='over';finish();$('status').textContent=win?'🎉 你贏了！擊沉了敵方全部 '+FLEET.length+' 艘船艦！':'💀 你輸了…你的 '+FLEET.length+' 艘船艦已全數被擊沉。';render();$('status').textContent=win?'🎉 你贏了！擊沉了敵方全部 '+FLEET.length+' 艘船艦！':'💀 你輸了…你的 '+FLEET.length+' 艘船艦已全數被擊沉。'}
function aiTurn(){
  if(phase!=='play')return;
  const i=aiPick(),r=shoot(P,i);
  log(describe('c',i,r));
  if(allSunk(P))return end(false);
  turn='p';busy=false;render();
}

$('pg').addEventListener('mouseover',e=>{if(phase!=='place')return;const i=e.target.dataset.i;if(i===undefined)return;hover=+i;showPreview()});
$('pg').addEventListener('mouseleave',()=>{if(phase==='place'){hover=-1;showPreview()}});
$('pg').addEventListener('click',e=>{
  if(phase!=='place'||P.ships.length>=FLEET.length)return;
  const i=e.target.dataset.i;if(i===undefined)return;
  const [n,l]=FLEET[P.ships.length],cs=can(P,+i,l,vert);
  if(cs){put(P,cs,n);render()}
});
$('eg').addEventListener('click',e=>{
  if(phase!=='play'||turn!=='p'||busy)return;
  const i=e.target.dataset.i;if(i===undefined||E.s[+i])return;
  if(mode!=='ai'){fireOnline(+i);return}
  const r=shoot(E,+i);log(describe('p',+i,r));
  if(allSunk(E))return end(true);
  turn='c';busy=true;render();
  setTimeout(aiTurn,800);
});
window.addEventListener('keydown',e=>{if((e.key==='r'||e.key==='R')&&phase==='place'){vert=!vert;render()}});
/* ===== 連線對戰（PeerJS 點對點）===== */
const ALPH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
let mode='ai',code='',me='',ev={},peer=null,conn=null,ready=false,lobbyKey='',firstW=false,OPP='電腦',lastShot=-1;
const send=o=>{try{if(conn&&conn.open)conn.send(o)}catch(e){}};
const genCode=()=>Array.from({length:6},()=>ALPH[Math.random()*ALPH.length|0]).join('');

function renderLobby(){
  const el=$('lobby'),show=(phase==='place'||phase==='wait');
  const joined=mode==='host'?!!ev['g-join']:true;
  const key=[show,phase,mode,code,joined,!!window.Peer].join('|');
  if(key===lobbyKey)return;lobbyKey=key;
  if(!show){el.innerHTML='';return}
  const canCancel=phase==='place';
  if(mode==='ai'){
    if(!window.Peer){el.innerHTML='<span class="note">目前模式：對戰電腦（連線元件載入失敗，請確認網路後重新整理）</span>';return}
    el.innerHTML='<span class="note">對手：電腦</span><button id="lc">🌐 建立連線房間</button><input id="lj" maxlength="6" placeholder="輸入房間序號"><button id="lg">加入</button>';
  }else if(mode==='host'){
    el.innerHTML='房間序號 <b class="code">'+code+'</b> <span class="note">把序號傳給同學 ・ 對手：'+(joined?'已加入 ✅':'等待加入…')+'</span>'+(canCancel?'<button id="lx">取消</button>':'');
  }else{
    el.innerHTML='已加入房間 <b class="code">'+code+'</b>'+(canCancel?'<button id="lx">離開</button>':'');
  }
  const g=id=>document.getElementById(id);
  if(g('lc'))g('lc').onclick=createRoom;
  if(g('lg'))g('lg').onclick=()=>joinRoom(g('lj').value);
  if(g('lj'))g('lj').onkeydown=e=>{if(e.key==='Enter')joinRoom(g('lj').value)};
  if(g('lx'))g('lx').onclick=()=>{leaveRoom();render()};
}
function leaveRoom(){
  const c=conn,p=peer;conn=null;peer=null;
  try{c&&c.close()}catch(e){}
  try{p&&p.destroy()}catch(e){}
  mode='ai';code='';me='';ev={};ready=false;firstW=false;OPP='電腦';lobbyKey='';lastShot=-1;revealed=false;oppRev=null;
}
function setupConn(cn){
  conn=cn;
  cn.on('data',onMsg);
  cn.on('close',()=>{
    if(conn!==cn)return;
    if(phase==='play'||phase==='wait'){phase='over';render();$('status').textContent='⚠️ 對手已離線，對戰中斷。請按「重新開始」。'}
    else if(phase==='place'){log('⚠️ 對手已離線。');delete ev['g-join'];lobbyKey='';renderLobby()}
  });
}
function createRoom(){
  if(!window.Peer){log('連線元件載入失敗，請確認網路後重新整理。');return}
  const c=genCode(),p=new Peer('bsh-'+c);peer=p;
  p.on('open',()=>{code=c;mode='host';me='h';OPP='對手';lobbyKey='';render()});
  p.on('connection',cn=>{
    if(conn){cn.on('open',()=>{cn.send({t:'full'});setTimeout(()=>cn.close(),300)});return}
    cn.on('open',()=>{setupConn(cn);send({t:'size',n:N});ev['g-join']=1;lobbyKey='';render()});
  });
  p.on('error',e=>{
    if(e.type==='unavailable-id'){p.destroy();peer=null;createRoom();return}
    log('⚠️ 連線錯誤：'+e.type);leaveRoom();render();
  });
}
function joinRoom(c){
  c=(c||'').trim().toUpperCase();if(!c)return;
  if(!window.Peer){log('連線元件載入失敗，請確認網路後重新整理。');return}
  const p=new Peer();peer=p;let ok=false;
  p.on('open',()=>{
    const cn=p.connect('bsh-'+c,{reliable:true});
    cn.on('open',()=>{ok=true;code=c;mode='guest';me='g';OPP='對手';setupConn(cn);lobbyKey='';render()});
    setTimeout(()=>{if(!ok&&peer===p){log('連線逾時：找不到房間 '+c+'，或雙方網路無法直連。');leaveRoom();render()}},12000);
  });
  p.on('error',e=>{
    if(peer!==p)return;
    log(e.type==='peer-unavailable'?'找不到房間 '+c+'，請確認序號。':'⚠️ 連線錯誤：'+e.type);
    leaveRoom();render();
  });
}
function readyOnline(){
  if(P.ships.length<FLEET.length||ready)return;
  ready=true;phase='wait';ev[me+'-ready']=1;render();
  send({t:'ready',n:N});sync();
}
function beginOnline(t){
  E={g:Array(N*N).fill(-1),s:Array(N*N).fill(0),ships:FLEET.map(([n,l])=>({name:n,len:l,cells:[],hits:0}))};
  phase='play';logs=[];busy=false;revealed=false;oppRev=null;turn=t===me?'p':'c';
  log(turn==='p'?'連線對戰開始：你先攻！':'連線對戰開始：對手先攻！');
  render();
}
function fireOnline(i){
  lastShot=i;busy=true;turn='c';render();
  send({t:'shot',i});
}
function sync(){
  if(mode==='ai')return;
  if(phase==='place'||phase==='wait')renderLobby();
  if(phase==='wait'&&me==='h'&&ev['h-ready']&&ev['g-ready']&&!firstW){
    firstW=true;const t=Math.random()<.5?'h':'g';
    send({t:'first',turn:t});beginOnline(t);return;
  }
  if(phase==='wait')render();
}
function onMsg(m){
  if(!m||typeof m!=='object')return;
  if(m.t==='size'){
    if(PRESETS[m.n]&&m.n!==N&&(phase==='place'||phase==='wait')){
      N=m.n;FLEET=buildFleet(N);P=nb();hover=-1;ready=false;delete ev['g-ready'];phase='place';applySize();lobbyKey='';
      log('房主設定棋盤為 '+N+'×'+N+'，請重新布置船艦。');render();
    }
    return;
  }
  if(m.t==='full'){log('房間已經有人加入了。');leaveRoom();render();return}
  if(m.t==='ready'){if(m.n!==N)return;ev[(me==='h'?'g':'h')+'-ready']=1;sync();return}
  if(m.t==='first'){if(phase==='wait')beginOnline(m.turn);return}
  if(m.t==='reveal'){oppRev=m.ships;if(phase==='over')applyReveal();return}
  if(phase!=='play')return;
  if(m.t==='shot'){
    const i=+m.i;
    if(!(i>=0&&i<N*N)||P.s[i])return;
    const r=shoot(P,i),win=allSunk(P),out={t:'res',hit:r.hit};
    if(r.hit){out.name=r.sh.name;out.sunk=r.sunk;if(r.sunk)out.cells=r.sh.cells}
    if(win)out.win=true;
    send(out);
    log(describe('c',i,r));
    if(win){end(false);return}
    turn='p';busy=false;render();
  }else if(m.t==='res'&&lastShot>=0){
    const i=lastShot;lastShot=-1;
    E.s[i]=m.hit?2:1;
    if(m.hit&&m.sunk&&Array.isArray(m.cells)){
      const k=E.ships.findIndex(s=>s.name===m.name&&s.hits<s.len);
      if(k>=0){E.ships[k].hits=E.ships[k].len;E.ships[k].cells=m.cells;m.cells.forEach(x=>E.g[x]=k)}
    }
    log(describe('p',i,{hit:m.hit,sunk:m.sunk,sh:{name:m.name}}));
    if(m.win){end(true);return}
    render();
  }
}
function finish(){
  if(mode==='ai'){revealed=true;log('雙方布置已公開，來看看電腦把船藏在哪吧！');return}
  send({t:'reveal',ships:P.ships.map(s=>({name:s.name,len:s.len,cells:s.cells}))});
  if(oppRev)applyReveal();
}
function applyReveal(){
  if(!oppRev||!E||!Array.isArray(oppRev))return;
  const B=nb();B.s=E.s.slice();
  for(const s of oppRev){
    if(!s||!Array.isArray(s.cells)||!s.cells.every(c=>Number.isInteger(c)&&c>=0&&c<N*N&&B.g[c]<0))continue;
    put(B,s.cells,String(s.name));
  }
  B.ships.forEach(s=>{s.hits=s.cells.filter(c=>B.s[c]===2).length});
  E=B;revealed=true;oppRev=null;
  log('雙方布置已公開，來看看對手把船藏在哪吧！');render();
}
function applySize(){document.documentElement.style.setProperty('--n',N);document.body.classList.toggle('big',N>=12)}
function sizeSel(){
  return `<select id="sz" ${mode==='guest'?'disabled':''}>`+Object.keys(PRESETS).map(k=>`<option value="${k}" ${+k===N?'selected':''}>${k}×${k}（${buildFleet(+k).length} 艘）</option>`).join('')+'</select>';
}
function setSize(n){
  if(!PRESETS[n]||phase!=='place'||mode==='guest')return;
  N=n;FLEET=buildFleet(n);P=nb();hover=-1;applySize();
  if(mode==='host'){delete ev['g-ready'];send({t:'size',n})}
  render();
}
render();
</script>
